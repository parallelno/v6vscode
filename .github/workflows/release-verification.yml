name: Shipped release verification
on:
  workflow_dispatch:

permissions:
  contents: read

# Deliberately manual: never run untrusted pull requests on the emulator runner.
# Configure repository variable V6EMUL and a Windows runner with label v6emul.
jobs:
  shipped-current-minimum-live:
    runs-on: [self-hosted, Windows, X64, v6emul]
    env:
      V6EMUL: ${{ vars.V6EMUL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: temp/release-verification.json
          if-no-files-found: warn